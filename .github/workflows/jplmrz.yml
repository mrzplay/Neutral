name: JplMrz

on:
  schedule:
    - cron: '0 * * * *' # Proti 1 ghonta por por run hobe
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Save JSON
        env:
          JPLMRZ: ${{ secrets.JPLMRZ }}
        run: |
          mkdir -p JplMrz
          python -c "
          import urllib.request, os, json

          url = os.environ['JPLMRZ']
          # Headers add kora hoyeche jate 406 error na ase
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
              'Accept': 'application/json, text/plain, */*'
          }
          req = urllib.request.Request(url, headers=headers)
          
          try:
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode('utf-8')
              
              parsed_data = json.loads(raw_data)

              with open('JplMrz/JplMrz.json', 'w', encoding='utf-8') as f:
                  json.dump(parsed_data, f, indent=4, ensure_ascii=False)
              print('Successfully updated JplMrz/JplMrz.json')
          except Exception as e:
              print(f'Error fetching or saving JSON: {e}')
              exit(1)
          "

      - name: Commit and Push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add JplMrz/JplMrz.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update JplMrz.json every 1 hour" && git push)
